        // 1. Faça um pequeno programa onde o usuário digite um valor e o programa retorna o valor digitado com aumento de 100%. 
        
//Entrada 
let valor = parseFloat(prompt("Digite um Valor"));
//Processamento
//let resultado = valor * 1.5;
let resultado = valor +((valor * 50)/100);
//Saída
//alert(valor + 'com 100% de aumento é : ' + resultado);
document.writeln(valor + ' com 50% de aumento é :' + resultado);
