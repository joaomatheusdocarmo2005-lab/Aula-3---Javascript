<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <script>
   
   //3. Desenvolva um pequeno script onde o usuário digitará o valor de um investimento. O programa retornará 30% do valor digitado para que esse investidor saiba quanto 
   //irá render tal investimento.
   
   //Entrada
   let valor = parseFloat(prompt("Digite o Valor"))
   let porcentagem = 30;

   //Processamento
   let resultado = (valor * porcentagem) / 100;

   //Saída
   document.writeln("Seu Rendimento Será :" + resultado);
   
   </script>
</body>
</html>
