<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício</title>
</head>
<body>
    <script>
        //01. Escreva um programa que pede o raio de um círculo, e em seguida exiba o perímetro e área do círculo.
        
        //Entrada
        let raio = parseFloat(prompt("Digite o Valor do Raio"));
        
        //Processamento
        //let areac = 3.14 * (raio * raio);
        let areac = Math.PI * Math.pow(raio,2);
        //let areac = 3.14 * raio**2;

        //Saída
        document.writeln("<br> Valor Apurado " +areac);
        document.writeln("<br> Arredonda para Cima " +Math.ceil(areac));
        document.writeln("<br> Arredonda para Baixo " +Math.floor(areac));
        document.writeln("<br> Fixa em Casa Decimal " +areac.toFixed(2));
    </script>
    
</body>
</html>
